name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest tests/unit/ -v --tb=short

  test-providers:
    name: Test ${{ matrix.provider }} Provider
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: spark
            extras: "spark,dev"
            test_path: tests/providers/test_spark.py
          - provider: anthropic
            extras: "anthropic,dev"
            test_path: tests/providers/test_llm_providers.py
          - provider: openai
            extras: "openai,dev"
            test_path: tests/providers/test_llm_providers.py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[${{ matrix.extras }}]"

      - name: Run ${{ matrix.provider }} tests
        run: pytest ${{ matrix.test_path }} -v --tb=short

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, test-providers]
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
